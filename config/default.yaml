server:
  port: 31499
  readTimeout: 15s
  writeTimeout: 60s

docker:
  network: "llmobs-network"
  subnet: "172.28.0.0/16"
  gateway: "172.28.0.1"
  composeFile: "docker-compose.yml"
  statelessFile: "docker-compose.stateless.yml"
  prodFile: "docker-compose.prod.yml"
  cloudflareFile: "docker-compose.cloudflare.yml"

orchestrator:
  defaultProfiles: ["full"]
  dataDir: "./data"
  primaryDataHost: "localhost"
  portRange:
    start: 31410
    end: 31426

paths:
  markers:
    - "env.schema"
    - "default.yaml"
    - "certs"
    - "traefik"
    - "alloydb"
