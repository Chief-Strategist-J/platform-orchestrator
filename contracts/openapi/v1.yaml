openapi: 3.1.0
info:
  title: Platform Infrastructure Orchestrator API
  version: 1.1.0
  description: >-
    Authoritative OpenAPI specification for the Platform Infrastructure Orchestrator,
    governing container stack lifecycles, autoscaling simulation, health verification,
    disaster recovery backups, platform setup bootstrapping, Cloudflare tunnel ingress,
    GDPR right-to-erasure workflows, port diagnostics, and cryptographic certificate lifecycle management.
servers:
  - url: http://localhost:31499/api/v1
    description: Local Platform Orchestrator Daemon

paths:
  /stack/up:
    post:
      summary: Start Infrastructure Stack
      operationId: startStack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StackUpRequest'
      responses:
        '200':
          description: Stack successfully initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StackActionResponse'
        '400':
          $ref: '#/components/responses/StandardErrorResponse'
        '500':
          $ref: '#/components/responses/StandardErrorResponse'

  /stack/down:
    post:
      summary: Stop Infrastructure Stack
      operationId: stopStack
      responses:
        '200':
          description: Stack successfully stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StackActionResponse'
        '500':
          $ref: '#/components/responses/StandardErrorResponse'

  /stack/status:
    get:
      summary: Get Infrastructure Stack Status
      operationId: getStackStatus
      responses:
        '200':
          description: Active container services status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StackStatusResponse'

  /scale/service:
    post:
      summary: Scale a Stateless Service
      operationId: scaleService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScaleServiceRequest'
      responses:
        '200':
          description: Service replica count updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScaleServiceResponse'
        '400':
          $ref: '#/components/responses/StandardErrorResponse'

  /scale/node:
    post:
      summary: Launch Simulated Compute Node
      operationId: launchComputeNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaunchComputeNodeRequest'
      responses:
        '200':
          description: Compute node successfully launched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LaunchComputeNodeResponse'
        '400':
          $ref: '#/components/responses/StandardErrorResponse'

  /scale/node/{nodeId}:
    delete:
      summary: Terminate Simulated Compute Node
      operationId: terminateComputeNode
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Compute node successfully terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StackActionResponse'

  /health:
    get:
      summary: Run Concurrent Health Checks
      operationId: checkPlatformHealth
      parameters:
        - name: primaryHost
          in: query
          required: false
          schema:
            type: string
            default: localhost
      responses:
        '200':
          description: Health check report (All Healthy)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReportResponse'
        '503':
          description: Health check report (Degraded / Unhealthy)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReportResponse'

  /certs/generate:
    post:
      summary: Generate Platform TLS Certificates
      operationId: generateCerts
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateCertsRequest'
      responses:
        '200':
          description: Certificates successfully generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateCertsResponse'

  /backup/execute:
    post:
      summary: Execute Database Disaster Recovery Backup and Optional Purge
      operationId: executeBackup
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackupExecuteRequest'
      responses:
        '200':
          description: Disaster recovery backup outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupExecuteResponse'
        '500':
          $ref: '#/components/responses/StandardErrorResponse'

  /setup/bootstrap:
    post:
      summary: Execute End-to-End 7-Step Bootstrapping Pipeline
      operationId: bootstrapPlatform
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupBootstrapRequest'
      responses:
        '200':
          description: Platform setup report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupBootstrapResponse'
        '500':
          $ref: '#/components/responses/StandardErrorResponse'

  /prereqs/audit:
    get:
      summary: Audit Host and Kernel System Prerequisites
      operationId: auditPrerequisites
      responses:
        '200':
          description: System prerequisites report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrereqAuditResponse'

  /cloudflare/token:
    post:
      summary: Configure and Save Cloudflare Tunnel Token
      operationId: configureCloudflareToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudflareTokenRequest'
      responses:
        '200':
          description: Token successfully saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudflareActionResponse'
        '400':
          $ref: '#/components/responses/StandardErrorResponse'

  /cloudflare/start:
    post:
      summary: Start Cloudflare Tunnel Ingress Container
      operationId: startCloudflareTunnel
      responses:
        '200':
          description: Cloudflare Tunnel started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudflareActionResponse'
        '500':
          $ref: '#/components/responses/StandardErrorResponse'

  /cloudflare/stop:
    post:
      summary: Stop Cloudflare Tunnel Ingress Container
      operationId: stopCloudflareTunnel
      responses:
        '200':
          description: Cloudflare Tunnel stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudflareActionResponse'

  /cloudflare/status:
    get:
      summary: Get Cloudflare Tunnel Status
      operationId: getCloudflareStatus
      responses:
        '200':
          description: Cloudflare Tunnel runtime status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudflareStatusResponse'

  /gdpr/erasure:
    post:
      summary: Execute GDPR and CCPA Right-to-Erasure Workflow
      operationId: executeGdprErasure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GdprErasureRequest'
      responses:
        '200':
          description: Data erasure audit outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GdprErasureResponse'
        '400':
          $ref: '#/components/responses/StandardErrorResponse'
        '500':
          $ref: '#/components/responses/StandardErrorResponse'

  /ports/status:
    get:
      summary: Check Availability of Core Platform Ports
      operationId: checkPortsStatus
      responses:
        '200':
          description: Port contention diagnostic report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortsStatusResponse'

  /grafana/datasources:
    get:
      summary: List Configured Grafana Datasources
      operationId: listDatasources
      responses:
        '200':
          description: List of datasources returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourcesListResponse'
        '500':
          $ref: '#/components/responses/StandardErrorResponse'
    post:
      summary: Create a New Grafana Datasource
      operationId: createDatasource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasourcePayload'
      responses:
        '200':
          description: Datasource created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleDatasourceResponse'
        '400':
          $ref: '#/components/responses/StandardErrorResponse'

  /grafana/datasources/sync:
    post:
      summary: Batch Sync Platform Datasources to Grafana
      operationId: syncDatasources
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasourceSyncOptions'
      responses:
        '200':
          description: Datasource synchronization report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourceSyncReportResponse'

  /grafana/datasources/{id}:
    get:
      summary: Get Datasource by ID, UID, or Name
      operationId: getDatasource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Datasource details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourceDetailResponse'
        '404':
          $ref: '#/components/responses/StandardErrorResponse'
    put:
      summary: Update Existing Datasource by UID
      operationId: updateDatasource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasourcePayload'
      responses:
        '200':
          description: Datasource updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleDatasourceResponse'
    delete:
      summary: Delete Datasource by UID or Name
      operationId: deleteDatasource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Datasource deletion status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertOperationResponse'

  /grafana/datasources/{id}/health:
    get:
      summary: Test Datasource Connectivity and Health
      operationId: testDatasourceHealth
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Datasource health diagnostic result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasourceHealthResponse'

  /grafana/dashboards:
    get:
      summary: Search Grafana Dashboards
      operationId: searchDashboards
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: folderUids
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Matching dashboards list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardsSearchResponse'
    post:
      summary: Create or Update Dashboard via DB Payload
      operationId: saveDashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardPayload'
      responses:
        '200':
          description: Dashboard save result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSaveResponse'

  /grafana/dashboards/import:
    post:
      summary: Import Dashboard from File or Remote URL
      operationId: importDashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DashboardImportOptions'
      responses:
        '200':
          description: Dashboard imported successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSaveResponse'

  /grafana/dashboards/{uid}:
    get:
      summary: Get Full Dashboard Model by UID
      operationId: getDashboard
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Full dashboard definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDetailResponse'
    delete:
      summary: Delete Dashboard by UID
      operationId: deleteDashboard
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dashboard deletion status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDeleteResponse'

  /grafana/alerts:
    get:
      summary: List Grafana Alert Rules
      operationId: listAlertRules
      responses:
        '200':
          description: Configured alert rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRulesListResponse'
    post:
      summary: Create or Update Grafana Alert Rule
      operationId: saveAlertRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRulePayload'
      responses:
        '200':
          description: Alert rule operation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertOperationResponse'

  /grafana/alerts/{uid}:
    get:
      summary: Get Alert Rule by UID
      operationId: getAlertRule
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Alert rule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRuleDetailResponse'
    delete:
      summary: Delete Alert Rule by UID
      operationId: deleteAlertRule
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Alert rule deletion status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertOperationResponse'

  /grafana/contact-points:
    get:
      summary: List Grafana Alerting Contact Points
      operationId: listContactPoints
      responses:
        '200':
          description: Contact points list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactPointsListResponse'
    post:
      summary: Create or Update Contact Point
      operationId: saveContactPoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactPointPayload'
      responses:
        '200':
          description: Contact point save result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertOperationResponse'

  /grafana/contact-points/test:
    post:
      summary: Test Alert Notification Dispatch to Contact Point
      operationId: testContactPoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactPointPayload'
      responses:
        '200':
          description: Test notification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertOperationResponse'

  /grafana/contact-points/{uid}:
    delete:
      summary: Delete Contact Point by UID
      operationId: deleteContactPoint
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Contact point deletion status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertOperationResponse'

  /services:
    get:
      summary: List Registered External Data Services
      operationId: listExternalServices
      responses:
        '200':
          description: External services list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicesListResponse'
    post:
      summary: Register New External Data Service
      operationId: registerExternalService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceDefinition'
      responses:
        '200':
          description: Service successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDetailResponse'

  /services/{id}:
    get:
      summary: Get Service Definition by ID
      operationId: getExternalService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Service definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDetailResponse'
    put:
      summary: Update Service Definition by ID
      operationId: updateExternalService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceDefinition'
      responses:
        '200':
          description: Updated service definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDetailResponse'
    delete:
      summary: Delete Service by ID
      operationId: deleteExternalService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Service deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceActionResponse'

  /services/{id}/health:
    get:
      summary: Test Service Health
      operationId: testServiceHealth
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Service probe health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealthResponse'

  /services/{id}/sync-to-grafana:
    post:
      summary: Provision Service Connection Directly to Grafana Datasources
      operationId: syncServiceToGrafana
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Grafana datasource synchronization result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleDatasourceResponse'

components:
  responses:
    StandardErrorResponse:
      description: Standard API Error Envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorEnvelope'

  schemas:
    MetaEnvelope:
      type: object
      required:
        - traceId
        - timestamp
        - version
      properties:
        traceId:
          type: string
          example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: v1

    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: ERR_INVALID_PROFILE
        message:
          type: string
          example: Requested profile does not exist.
        target:
          type: string

    ApiErrorEnvelope:
      type: object
      required:
        - meta
        - errors
      properties:
        meta:
          $ref: '#/components/schemas/MetaEnvelope'
        data:
          type: object
          nullable: true
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiError'

    StackUpRequest:
      type: object
      properties:
        profiles:
          type: array
          items:
            type: string
          example: ["stateless", "compute"]
        detach:
          type: boolean
          default: true

    StackActionResponse:
      type: object
      required:
        - meta
        - data
      properties:
        meta:
          $ref: '#/components/schemas/MetaEnvelope'
        data:
          type: object
          properties:
            message:
              type: string
            status:
              type: string
            activeServices:
              type: array
              items:
                type: string

    StackStatusResponse:
      type: object
      required:
        - meta
        - data
      properties:
        meta:
          $ref: '#/components/schemas/MetaEnvelope'
        data:
          type: object
          properties:
            services:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  status:
                    type: string
                  ports:
                    type: string

    ScaleServiceRequest:
      type: object
      required:
        - service
        - replicas
      properties:
        service:
          type: string
          example: llmobs-temporal
        replicas:
          type: integer
          minimum: 1
          example: 3

    ScaleServiceResponse:
      type: object
      required:
        - meta
        - data
      properties:
        meta:
          $ref: '#/components/schemas/MetaEnvelope'
        data:
          type: object
          properties:
            service:
              type: string
            replicas:
              type: integer
            message:
              type: string

    LaunchComputeNodeRequest:
      type: object
      required:
        - nodeId
      properties:
        nodeId:
          type: integer
          minimum: 2
          example: 2
        primaryDataHost:
          type: string
          default: host.docker.internal
        enableCloudflare:
          type: boolean
          default: false

    LaunchComputeNodeResponse:
      type: object
      required:
        - meta
        - data
      properties:
        meta:
          $ref: '#/components/schemas/MetaEnvelope'
        data:
          type: object
          properties:
            nodeId:
              type: integer
            projectName:
              type: string
            primaryDataHost:
              type: string
            assignedPorts:
              type: object
              additionalProperties:
                type: integer

    HealthReportResponse:
      type: object
      required:
        - meta
        - data
      properties:
        meta:
          $ref: '#/components/schemas/MetaEnvelope'
        data:
          type: object
          properties:
            healthy:
              type: boolean
            checkedCount:
              type: integer
            results:
              type: array
              items:
                type: object
                properties:
                  service:
                    type: string
                  target:
                    type: string
                  status:
                    type: string
                  latencyMs:
                    type: number

    GenerateCertsRequest:
      type: object
      properties:
        force:
          type: boolean
          default: false
        domains:
          type: array
          items:
            type: string

    GenerateCertsResponse:
      type: object
      required:
        - meta
        - data
      properties:
        meta:
          $ref: '#/components/schemas/MetaEnvelope'
        data:
          type: object
          properties:
            certPath:
              type: string
            keyPath:
              type: string
            generated:
              type: boolean

    BackupExecuteRequest:
      type: object
      properties:
        backupOnly:
          type: boolean
          default: false
        purge:
          type: boolean
          default: true
        targetDir:
          type: string

    BackupExecuteResponse:
      type: object
      required:
        - meta
        - data
      properties:
        meta:
          $ref: '#/components/schemas/MetaEnvelope'
        data:
          type: object
          properties:
            success:
              type: boolean
            alloyDbDumpFile:
              type: string
            clickHouseDumpFile:
              type: string
            volumesPurged:
              type: boolean
            message:
              type: string

    SetupBootstrapRequest:
      type: object
      properties:
        pullImages:
          type: boolean
          default: false

    SetupBootstrapResponse:
      type: object
      required:
        - meta
        - data
      properties:
        meta:
          $ref: '#/components/schemas/MetaEnvelope'
        data:
          type: object
          properties:
            totalSteps:
              type: integer
            passedSteps:
              type: integer
            success:
              type: boolean
            steps:
              type: array
              items:
                type: object
                properties:
                  index:
                    type: integer
                  name:
                    type: string
                  passed:
                    type: boolean
                  duration:
                    type: string
                  description:
                    type: string
                  error:
                    type: string
            message:
              type: string

    PrereqAuditResponse:
      type: object
      required:
        - meta
        - data
      properties:
        meta:
          $ref: '#/components/schemas/MetaEnvelope'
        data:
          type: object
          properties:
            passed:
              type: boolean
            checks:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  passed:
                    type: boolean
                  critical:
                    type: boolean
                  message:
                    type: string
                  remedyMsg:
                    type: string

    CloudflareTokenRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string

    CloudflareActionResponse:
      type: object
      required:
        - meta
        - data
      properties:
        meta:
          $ref: '#/components/schemas/MetaEnvelope'
        data:
          type: object
          properties:
            status:
              type: string
            active:
              type: boolean
            message:
              type: string

    CloudflareStatusResponse:
